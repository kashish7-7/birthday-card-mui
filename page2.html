<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mummy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: #4A0E0E;
    background-image: radial-gradient(circle at 50% 30%, #6b1414 0%, #4A0E0E 65%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow {
    position: absolute;
    width: 70vw;
    height: 70vw;
    max-width: 420px;
    max-height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 200, 120, 0.35) 0%, rgba(255, 200, 120, 0) 70%);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .center-image {
    position: relative;
    max-width: 70vw;
    max-height: 65vh;
    width: auto;
    height: auto;
    cursor: pointer;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    transition: transform 0.35s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .center-image:hover {
    transform: scale(1.03);
  }

  .center-image.tapped {
    transform: scale(1.12);
  }

  .hint {
    position: absolute;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: #f2d9b0;
    letter-spacing: 0.05em;
    opacity: 0.8;
  }

  .sound-prompt {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.35);
    color: #f2d9b0;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    border: 1px solid rgba(242, 217, 176, 0.4);
    display: none;
  }

  .sound-prompt.show {
    display: block;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <img src="shiva.png" alt="Lord Shiva" class="center-image" id="mainImage">
    <div class="hint">tap the image</div>
    <div class="sound-prompt" id="soundPrompt">🔊 tap for sound</div>
  </div>

  <audio id="bgAudio" src="audio.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('bgAudio');
    const soundPrompt = document.getElementById('soundPrompt');
    const img = document.getElementById('mainImage');

    const tryPlay = () => {
      const p = audio.play();
      if (p !== undefined) {
        p.catch(() => {
          soundPrompt.classList.add('show');
        });
      }
    };

    window.addEventListener('load', tryPlay);

    soundPrompt.addEventListener('click', () => {
      audio.play();
      soundPrompt.classList.remove('show');
    });

    img.addEventListener('click', () => {
      img.classList.add('tapped');
      setTimeout(() => {
        window.location.href = "page3.html";
      }, 250);
    });
  </script>
</body>
</html>
